<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桌面待办 · 滚动插件</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI','Inter',system-ui,-apple-system,sans-serif; user-select:none; }
        body {
            background: transparent; display:flex; justify-content:center; align-items:center;
            min-height:100vh; padding:12px; color-scheme:light dark;
        }
        .widget {
            width: 440px; max-width:100%;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15), 0 6px 12px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.4);
            padding: 22px 20px 16px;
            display:flex; flex-direction:column; max-height: 680px;
        }
        @media (prefers-color-scheme: dark) {
            .widget { background: rgba(32,32,36,0.9); border-color: rgba(255,255,255,0.08); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
            .task-text, .date-header { color: #eaeef2; }
            .add-btn, .view-btn, .tool-btn { background: #2c2c30; color: #eaeef2; border-color: #3e3e42; }
            .add-btn:hover, .view-btn:hover, .tool-btn:hover { background: #3a3a3e; }
            .task-item { background: #27272b; border-color: #3a3a3e; }
            .task-item.completed .task-text { color: #6b6f76; }
            .group-title { color: #949ca6; }
            .add-input { background: #1c1c1f; border-color: #3e3e42; color: #eaeef2; }
            .note-input { background:#1c1c1f; border-color:#3e3e42; color:#eaeef2; }
        }
        .widget-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; padding:0 4px; }
        .date-header { font-weight:600; font-size:1.15rem; color:#1e1e24; }
        .header-right { display:flex; gap:6px; align-items:center; }
        .view-btn, .tool-btn {
            background:#f0f2f5; border:1px solid #d0d7de; color:#1e1e24;
            border-radius:40px; padding:5px 12px; font-size:0.78rem; font-weight:500;
            cursor:pointer; transition: background .15s; white-space:nowrap;
        }
        .view-btn:hover, .tool-btn:hover { background:#e3e6ea; }
        .tool-btn { width:34px; height:34px; padding:0; display:flex; align-items:center; justify-content:center; font-size:1rem; }
        .add-section { display:flex; gap:8px; margin-bottom:14px; }
        .add-input {
            flex:1; padding:11px 14px; border-radius:40px;
            border:1px solid #d0d7de; background:rgba(255,255,255,0.7);
            font-size:0.9rem; outline:none; color:#1e1e24;
        }
        .add-input:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,0.2); }
        .add-btn {
            background:#fff; border:1px solid #d0d7de; border-radius:40px;
            width:44px; height:44px; font-size:1.5rem; display:flex;
            align-items:center; justify-content:center; cursor:pointer; color:#1e1e24;
        }
        .add-btn:hover { background:#f0f2f5; }
        .tasks-container { flex:1; overflow-y:auto; padding-right:4px; margin-bottom:6px; }
        .tasks-container::-webkit-scrollbar { width:4px; }
        .tasks-container::-webkit-scrollbar-thumb { background:#c0c8d0; border-radius:8px; }
        .task-group { margin-bottom:16px; }
        .group-title { font-size:0.75rem; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; color:#5d6a78; margin:0 0 8px 6px; display:flex; align-items:center; gap:6px; }
        .task-item {
            display:flex; align-items:center; gap:8px;
            padding:9px 10px 9px 14px;
            background:#fff; border:1px solid #e4e8ec; border-radius:16px;
            margin-bottom:6px; transition:all .15s; position:relative;
            flex-wrap: wrap;
        }
        .task-item:hover { border-color:#b8c2cc; }
        .task-item.completed { background:#f4f6f8; border-color:#e0e4e8; opacity:0.85; }
        @media (prefers-color-scheme: dark) { .task-item.completed { background:#202024; border-color:#2e2e32; } }
        .task-main { display:flex; align-items:center; gap:10px; width:100%; }
        .task-checkbox {
            width:20px; height:20px; border-radius:6px;
            border:1.5px solid #b0b8c0; background:transparent;
            cursor:pointer; flex-shrink:0; appearance:none; -webkit-appearance:none;
            position:relative; transition: background .1s, border-color .1s;
        }
        .task-checkbox:checked { background:#3b82f6; border-color:#3b82f6; }
        .task-checkbox:checked::after { content:"✓"; color:#fff; font-size:13px; font-weight:600; position:absolute; left:3px; top:-1px; }
        .task-checkbox:hover { border-color:#3b82f6; }
        .task-text {
            flex:1; font-size:0.9rem; color:#1e1e24; word-break:break-word;
            line-height:1.4; transition:color .2s, text-decoration .2s;
            padding:2px 4px; border-radius:6px; outline:none;
        }
        .task-text:focus { background:#eef2f6; cursor:text; }
        .task-item.completed .task-text { color:#9098a2; text-decoration:line-through; }
        .note-toggle {
            flex-shrink:0; width:18px; height:18px; border-radius:50%;
            border:none; background:transparent; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            font-size:0.7rem; color:#c0c8d0; transition:all .15s;
            opacity:0.5; padding:0;
        }
        .note-toggle:hover { background:#eef2f6; color:#3b82f6; opacity:1; }
        .note-toggle.has-note { color:#f59e0b; opacity:1; font-size:0.85rem; }
        .note-toggle.has-note::before { content:"📝"; font-size:0.7rem; }
        .note-toggle.has-note { background:transparent; }
        .note-toggle.has-note:hover { background:#fef3c7; }
        @media (prefers-color-scheme: dark) {
            .note-toggle:hover { background:#3a3a3e; color:#60a5fa; }
            .note-toggle.has-note:hover { background:#4a3a10; }
        }
        .note-area {
            width:100%; margin-top:6px; margin-left:30px;
            display:none;
        }
        .note-area.open { display:block; }
        .note-input {
            width:100%; padding:7px 10px; font-size:0.78rem;
            border-radius:10px; border:1px solid #d0d7de;
            background:#fafbfc; color:#1e1e24; outline:none;
            font-family:inherit; resize:vertical; min-height:34px;
            user-select:text;
        }
        .note-input:focus { border-color:#3b82f6; box-shadow:0 0 0 2px rgba(59,130,246,0.15); }
        .note-input::placeholder { color:#a0a8b0; }
        .task-actions { display:flex; gap:2px; opacity:0; transition:opacity .15s; }
        .task-item:hover .task-actions { opacity:1; }
        .task-action-btn {
            background:transparent; border:none; cursor:pointer;
            width:26px; height:26px; border-radius:8px; font-size:0.85rem;
            display:flex; align-items:center; justify-content:center; color:#8a94a0;
        }
        .task-action-btn:hover { background:#eef2f6; color:#1e1e24; }
        @media (prefers-color-scheme: dark) { .task-action-btn:hover { background:#3a3a3e; color:#eaeef2; } }
        .empty-message { text-align:center; color:#8a94a0; font-size:0.85rem; padding:28px 16px; font-style:italic; }
        .footer-info {
            font-size:0.7rem; color:#8a94a0; text-align:right;
            padding:6px 6px 0; border-top:1px solid #e0e4e8; margin-top:4px;
            display:flex; justify-content:space-between; align-items:center;
        }
        @media (prefers-color-scheme: dark) { .footer-info { border-color:#2e2e32; } }
        .view-badge {
            background:#3b82f6; color:#fff; border-radius:20px;
            padding:1px 8px; font-size:0.65rem; font-weight:500;
        }
        .rolled-badge { background:#f59e0b; }
        .toast {
            position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
            background:#1e1e24; color:#fff; padding:8px 20px; border-radius:30px;
            font-size:0.8rem; opacity:0; transition:opacity .3s; pointer-events:none;
            z-index:9999;
        }
        .toast.show { opacity:1; }
    </style>
</head>
<body>
<div class="widget" id="widget">
    <div class="widget-header">
        <span class="date-header" id="currentDateDisplay">加载中...</span>
        <div class="header-right">
            <button class="tool-btn" id="exportBtn" title="导出为 Excel">⬇</button>
            <button class="tool-btn" id="importBtn" title="导入备份">⬆</button>
            <input type="file" id="importFile" accept=".json" style="display:none">
            <button class="view-btn" id="viewToggleBtn"><span id="viewBtnText">每日视图</span></button>
        </div>
    </div>

    <div class="add-section">
        <input type="text" class="add-input" id="taskInput" placeholder="添加新待办..." autocomplete="off">
        <button class="add-btn" id="addTaskBtn" title="添加到今天">+</button>
    </div>

    <div class="tasks-container" id="tasksContainer"></div>

    <div class="footer-info">
        <span id="statsInfo">0 完成 · 0 待办</span>
        <button class="tool-btn" id="clearCompletedBtn" title="清除所有已完成" style="font-size:0.7rem; width:auto; padding:2px 10px; height:auto;">清除已完成</button>
    </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function() {
    const STORAGE_KEY = 'desktop_todo_widget_data_v3';
    let allData = {};
    let currentView = 'daily';
    let currentDateStr = getTodayDateStr();
    const openNotes = new Set();

    const dateDisplayEl = document.getElementById('currentDateDisplay');
    const viewToggleBtn = document.getElementById('viewToggleBtn');
    const viewBtnText = document.getElementById('viewBtnText');
    const taskInput = document.getElementById('taskInput');
    const addTaskBtn = document.getElementById('addTaskBtn');
    const tasksContainer = document.getElementById('tasksContainer');
    const statsInfo = document.getElementById('statsInfo');
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const importFile = document.getElementById('importFile');
    const clearCompletedBtn = document.getElementById('clearCompletedBtn');
    const toastEl = document.getElementById('toast');

    function getTodayDateStr() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    function getTodayDisplay() {
        return new Date().toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric', weekday:'short' });
    }
    function generateId() { return Date.now()+'-'+Math.random().toString(36).substring(2,10); }
    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(window._toastTimer);
        window._toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 1800);
    }

    function migrateData(raw) {
        if (!raw || typeof raw !== 'object') return {};
        const result = {};
        const normalize = (t) => ({
            ...t,
            isRolled: t.isRolled || false,
            id: t.id || generateId(),
            note: t.note || '',
            completedAt: t.completedAt || null
        });
        if (Array.isArray(raw)) {
            result[getTodayDateStr()] = { tasks: raw.map(normalize) };
        } else {
            Object.keys(raw).forEach(key => {
                const day = raw[key];
                if (day && Array.isArray(day.tasks)) {
                    result[key] = { tasks: day.tasks.map(normalize) };
                } else if (Array.isArray(day)) {
                    result[key] = { tasks: day.map(normalize) };
                }
            });
        }
        return result;
    }

    function loadData() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            try { allData = migrateData(JSON.parse(stored)); }
            catch(e) { console.warn('解析失败，重置'); allData = {}; }
        } else {
            let migrated = false;
            for (const oldKey of ['desktop_todo_widget_data_v2','desktop_todo_widget_data_v1']) {
                const old = localStorage.getItem(oldKey);
                if (old) {
                    try { allData = migrateData(JSON.parse(old)); migrated = true; break; }
                    catch(e) {}
                }
            }
            if (!migrated) {
                allData = {};
                const today = getTodayDateStr();
                allData[today] = { tasks: [
                    { id:generateId(), text:'点击方框完成，完成会自动排到最下方', completed:false, createdAt:Date.now(), isRolled:false, note:'', completedAt:null },
                    { id:generateId(), text:'每个任务后的 · 点开可写感悟备注', completed:false, createdAt:Date.now(), isRolled:false, note:'', completedAt:null },
                    { id:generateId(), text:'导出 Excel 会包含完成日期和备注', completed:false, createdAt:Date.now(), isRolled:false, note:'', completedAt:null }
                ]};
            }
        }
        const today = getTodayDateStr();
        if (!allData[today]) allData[today] = { tasks: [] };
    }

    function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(allData)); }

    function rolloverIncompleteTasks() {
        const today = getTodayDateStr();
        const dates = Object.keys(allData).sort();
        if (dates.length === 0) { if (!allData[today]) allData[today] = { tasks: [] }; return; }
        const pastDates = dates.filter(d => d < today);
        if (pastDates.length === 0) { if (!allData[today]) allData[today] = { tasks: [] }; return; }
        const tasksToRoll = [];
        pastDates.forEach(dateKey => {
            const day = allData[dateKey];
            if (!day || !Array.isArray(day.tasks)) return;
            const remaining = [];
            day.tasks.forEach(task => {
                if (!task.completed) {
                    tasksToRoll.push({ ...task, isRolled: true });
                } else { remaining.push(task); }
            });
            allData[dateKey].tasks = remaining;
        });
        if (tasksToRoll.length > 0) {
            if (!allData[today]) allData[today] = { tasks: [] };
            tasksToRoll.forEach(t => { allData[today].tasks.push(t); });
        }
        saveData();
    }

    function getDisplayTasks() {
        const today = getTodayDateStr();
        if (currentView === 'daily') {
            return { type:'daily', dates:[today], tasksByDate:{ [today]: allData[today]?.tasks || [] } };
        } else {
            const allDates = Object.keys(allData).sort().reverse();
            const tasksByDate = {};
            allDates.forEach(d => { tasksByDate[d] = allData[d]?.tasks || []; });
            return { type:'all', dates: allDates, tasksByDate };
        }
    }

    function formatDateLabel(dateStr) {
        if (dateStr === getTodayDateStr()) return '今天';
        const d = new Date(dateStr+'T00:00:00');
        const today = new Date(getTodayDateStr()+'T00:00:00');
        const diff = Math.round((today-d)/(86400000));
        if (diff===1) return '昨天';
        if (diff===2) return '前天';
        if (diff<7 && diff>0) return `${diff}天前`;
        return d.toLocaleDateString('zh-CN', { month:'numeric', day:'numeric' });
    }

    function updateStats() {
        let c=0, p=0;
        Object.values(allData).forEach(day => {
            if (day?.tasks) day.tasks.forEach(t => { t.completed ? c++ : p++; });
        });
        statsInfo.textContent = `${c} 完成 · ${p} 待办`;
    }

    function sortTasks(tasks) {
        return [...tasks].sort((a, b) => {
            if (a.completed === b.completed) return 0;
            return a.completed ? 1 : -1;
        });
    }

    function render() {
        const today = getTodayDateStr();
        if (currentDateStr !== today) { currentDateStr = today; rolloverIncompleteTasks(); }
        dateDisplayEl.textContent = getTodayDisplay();
        const display = getDisplayTasks();
        const { type, dates, tasksByDate } = display;
        tasksContainer.innerHTML = '';

        if (dates.length === 0) {
            tasksContainer.innerHTML = '<div class="empty-message">✨ 暂无待办，享受当下 ✨</div>';
            updateStats(); return;
        }

        dates.forEach(dateStr => {
            const rawTasks = tasksByDate[dateStr] || [];
            const tasks = sortTasks(rawTasks);
            if (type === 'all') {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'task-group';
                const titleDiv = document.createElement('div');
                titleDiv.className = 'group-title';
                titleDiv.textContent = formatDateLabel(dateStr);
                const hasRolled = tasks.some(t => t.isRolled);
                if (hasRolled) {
                    const b = document.createElement('span');
                    b.className = 'view-badge rolled-badge';
                    b.textContent = '累计滚动';
                    titleDiv.appendChild(b);
                }
                groupDiv.appendChild(titleDiv);
                const list = document.createElement('div');
                tasks.forEach(t => list.appendChild(createTaskElement(t, dateStr)));
                if (tasks.length === 0) {
                    const e = document.createElement('div');
                    e.className = 'empty-message'; e.style.padding='10px'; e.textContent='无待办';
                    list.appendChild(e);
                }
                groupDiv.appendChild(list);
                tasksContainer.appendChild(groupDiv);
            } else {
                const hasRolled = tasks.some(t => t.isRolled);
                if (hasRolled) {
                    const bd = document.createElement('div');
                    bd.style.marginBottom='8px'; bd.style.marginLeft='4px';
                    bd.innerHTML = '<span class="view-badge rolled-badge">累计滚动待办</span>';
                    tasksContainer.appendChild(bd);
                }
                tasks.forEach(t => tasksContainer.appendChild(createTaskElement(t, dateStr)));
                if (tasks.length === 0) {
                    tasksContainer.innerHTML = '<div class="empty-message">✨ 今天暂无待办，添加一个吧 ✨</div>';
                }
            }
        });
        updateStats();
    }

    function createTaskElement(task, dateStr) {
        const item = document.createElement('div');
        item.className = `task-item ${task.completed ? 'completed' : ''}`;
        item.dataset.taskId = task.id;
        item.dataset.dateStr = dateStr;

        const mainRow = document.createElement('div');
        mainRow.className = 'task-main';

        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.className = 'task-checkbox'; cb.checked = task.completed;
        cb.addEventListener('change', (e) => {
            e.stopPropagation();
            const day = allData[dateStr];
            if (!day) return;
            const t = day.tasks.find(x => x.id === task.id);
            if (t) {
                t.completed = !t.completed;
                t.completedAt = t.completed ? getTodayDateStr() : null;
                saveData(); render();
            }
        });

        const text = document.createElement('span');
        text.className = 'task-text';
        text.textContent = task.text;
        text.contentEditable = false;
        text.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            text.contentEditable = true;
            text.focus();
            document.execCommand && document.execCommand('selectAll', false, null);
        });
        text.addEventListener('blur', () => {
            text.contentEditable = false;
            const newText = text.textContent.trim();
            if (newText && newText !== task.text) {
                const day = allData[dateStr];
                if (day) {
                    const t = day.tasks.find(x => x.id === task.id);
                    if (t) { t.text = newText; saveData(); }
                }
            } else if (!newText) {
                text.textContent = task.text;
            }
        });
        text.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); text.blur(); }
            if (e.key === 'Escape') { text.textContent = task.text; text.blur(); }
        });

        const noteToggle = document.createElement('button');
        noteToggle.className = 'note-toggle' + (task.note ? ' has-note' : '');
        noteToggle.title = task.note ? '查看/编辑备注' : '添加感悟/备注';
        if (!task.note) noteToggle.textContent = '·';
        noteToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            const area = item.querySelector('.note-area');
            const input = area.querySelector('.note-input');
            if (area.classList.contains('open')) {
                area.classList.remove('open');
                openNotes.delete(task.id);
            } else {
                area.classList.add('open');
                openNotes.add(task.id);
                setTimeout(() => input.focus(), 30);
            }
        });

        const actions = document.createElement('div');
        actions.className = 'task-actions';

        const delBtn = document.createElement('button');
        delBtn.className = 'task-action-btn';
        delBtn.title = '删除';
        delBtn.textContent = '🗑';
        delBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const day = allData[dateStr];
            if (day) {
                day.tasks = day.tasks.filter(x => x.id !== task.id);
                openNotes.delete(task.id);
                saveData(); render();
            }
        });

        actions.appendChild(delBtn);

        mainRow.appendChild(cb);
        mainRow.appendChild(text);
        mainRow.appendChild(noteToggle);
        mainRow.appendChild(actions);
        item.appendChild(mainRow);

        const noteArea = document.createElement('div');
        noteArea.className = 'note-area';
        if (openNotes.has(task.id)) noteArea.classList.add('open');

        const noteInput = document.createElement('textarea');
        noteInput.className = 'note-input';
        noteInput.rows = 2;
        noteInput.placeholder = '写点感悟或备注... (失焦自动保存)';
        noteInput.value = task.note || '';
        noteInput.addEventListener('click', (e) => e.stopPropagation());
        noteInput.addEventListener('blur', () => {
            const day = allData[dateStr];
            if (!day) return;
            const t = day.tasks.find(x => x.id === task.id);
            if (t) {
                const newNote = noteInput.value.trim();
                if (t.note !== newNote) {
                    t.note = newNote;
                    saveData();
                    const newToggle = item.querySelector('.note-toggle');
                    if (newToggle) {
                        if (newNote) {
                            newToggle.classList.add('has-note');
                            newToggle.textContent = '';
                            newToggle.title = '查看/编辑备注';
                        } else {
                            newToggle.classList.remove('has-note');
                            newToggle.textContent = '·';
                            newToggle.title = '添加感悟/备注';
                        }
                    }
                }
            }
        });

        noteArea.appendChild(noteInput);
        item.appendChild(noteArea);

        return item;
    }

    function addNewTask() {
        const text = taskInput.value.trim();
        if (!text) return;
        const today = getTodayDateStr();
        if (!allData[today]) allData[today] = { tasks: [] };
        allData[today].tasks.push({
            id: generateId(), text, completed:false, createdAt:Date.now(),
            isRolled:false, note:'', completedAt:null
        });
        saveData(); taskInput.value = ''; render();
    }

    function toggleView() {
        if (currentView === 'daily') { currentView='all'; viewBtnText.textContent='全部日期'; }
        else { currentView='daily'; viewBtnText.textContent='每日视图'; }
        render();
    }

    function exportData() {
        if (typeof XLSX === 'undefined') {
            alert('Excel 导出库未加载成功，请检查网络后刷新页面。');
            return;
        }

        const rows = [];
        const allDates = Object.keys(allData).sort();

        allDates.forEach(dateStr => {
            const day = allData[dateStr];
            if (!day || !Array.isArray(day.tasks)) return;
            day.tasks.forEach(task => {
                rows.push({
                    '所属日期': dateStr,
                    '任务内容': task.text,
                    '状态': task.completed ? '已完成' : '未完成',
                    '完成日期': task.completed ? (task.completedAt || '') : '',
                    '是否累计滚动': task.isRolled ? '是' : '否',
                    '备注/感悟': task.note || ''
                });
            });
        });

        if (rows.length === 0) {
            alert('暂无任何待办数据可导出。');
            return;
        }

        const ws = XLSX.utils.json_to_sheet(rows);
        ws['!cols'] = [
            { wch: 12 }, { wch: 36 }, { wch: 10 },
            { wch: 12 }, { wch: 14 }, { wch: 40 }
        ];

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, '待办明细');

        const today = getTodayDateStr();
        XLSX.writeFile(wb, `待办备份_${today}.xlsx`);
        showToast('已导出 Excel 文件（含完成日期和备注）');
    }

    function importData(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                const migrated = migrateData(data);
                if (confirm('导入将覆盖当前所有数据，确定继续？')) {
                    allData = migrated;
                    saveData();
                    currentDateStr = getTodayDateStr();
                    rolloverIncompleteTasks();
                    render();
                    showToast('导入成功');
                }
            } catch(err) { alert('文件格式错误，导入失败'); }
        };
        reader.readAsText(file);
    }

    function clearCompleted() {
        if (!confirm('确定清除所有日期中已完成的任务？此操作不可撤销。')) return;
        let count = 0;
        Object.keys(allData).forEach(dateKey => {
            const day = allData[dateKey];
            if (day?.tasks) {
                const before = day.tasks.length;
                day.tasks = day.tasks.filter(t => !t.completed);
                count += before - day.tasks.length;
            }
        });
        saveData(); render();
        showToast(`已清除 ${count} 个已完成任务`);
    }

    function init() {
        loadData();
        rolloverIncompleteTasks();
        currentDateStr = getTodayDateStr();
        render();

        addTaskBtn.addEventListener('click', addNewTask);
        taskInput.addEventListener('keypress', (e) => { if (e.key==='Enter') { e.preventDefault(); addNewTask(); } });
        viewToggleBtn.addEventListener('click', toggleView);
        exportBtn.addEventListener('click', exportData);
        importBtn.addEventListener('click', () => importFile.click());
        importFile.addEventListener('change', (e) => {
            if (e.target.files.length) { importData(e.target.files[0]); importFile.value=''; }
        });
        clearCompletedBtn.addEventListener('click', clearCompleted);

        setInterval(() => {
            const t = getTodayDateStr();
            if (currentDateStr !== t) { currentDateStr = t; rolloverIncompleteTasks(); render(); }
        }, 60000);
    }

    init();
})();
</script>
</body>
</html>
